syntax = "proto3";

package route.v1;

import "route/v1/route_components.proto";
import "route/v1/agent_config.proto";

option go_package = "github.com/kdubbo/xds-api/route/v1;routev1";

message RouteConfiguration {
  string name = 1;
  repeated VirtualHost virtual_hosts = 2;
  AgentConfig agent_config = 3;
}
