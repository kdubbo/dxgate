apiVersion: v1
kind: Namespace
metadata:
  name: dubbo-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dxgate-bootstrap
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
data:
  bootstrap.json: |
    {
      "xds_address": "http://dubbod.dubbo-system.svc:15012",
      "listener_names": ["dxgate.dubbo-system.svc.cluster.local:80"],
      "cluster_id": "Kubernetes",
      "dns_domain": "cluster.local"
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dxgate
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxgate
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dxgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dxgate
    spec:
      serviceAccountName: dxgate
      # Must exceed DXGATE_DRAIN_TIMEOUT_SECONDS, or the kubelet SIGKILLs dxgate
      # mid-drain and in-flight requests are dropped anyway.
      terminationGracePeriodSeconds: 40
      containers:
        - name: dxgate
          image: kdubbo/dxgate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DXGATE_CONTROLLER_ENABLED
              value: "true"
            - name: DXGATE_BOOTSTRAP
              value: /etc/dxgate/bootstrap.json
            - name: DXGATE_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: DXGATE_UI_ADDR
              value: 0.0.0.0:15021
            - name: DXGATE_DRAIN_TIMEOUT_SECONDS
              value: "30"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
            - name: ui
              containerPort: 15021
          readinessProbe:
            httpGet:
              path: /readyz
              port: ui
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: bootstrap
              mountPath: /etc/dxgate
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: bootstrap
          configMap:
            name: dxgate-bootstrap
            items:
              - key: bootstrap.json
                path: bootstrap.json
---
apiVersion: v1
kind: Service
metadata:
  name: dxgate
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: dxgate
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: dxgate-ui
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dxgate
  ports:
    - name: ui
      port: 15021
      targetPort: ui
