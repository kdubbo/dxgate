# The AI-gateway slice: an OpenAI-compatible route, an MCP route, and the
# provider they resolve through.
#
# This is the part of dxgate that `dubbod` knows nothing about. xDS carries
# listeners and clusters; providers, backends, agent routes, and policies only
# ever come from these CRDs.
#
# Reaching a hosted provider needs its credential on the dxgate container, named
# by `api_key_env`:
#
#   kubectl -n dubbo-system create secret generic dxgate-llm \
#     --from-literal=OPENAI_API_KEY=sk-...
#
# then on the dxgate container in examples/deployment.yaml:
#
#   env:
#     - name: OPENAI_API_KEY
#       valueFrom:
#         secretKeyRef:
#           name: dxgate-llm
#           key: OPENAI_API_KEY
#
# Callers speak the OpenAI chat-completions API to dxgate regardless of which
# provider a route resolves to; requests for a provider with its own wire format
# are translated at the gateway.
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: Dxgate
metadata:
  name: providers
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  version: llm-example
  providers:
    # `base_url` is optional for a named vendor: it falls back to that vendor's
    # public endpoint. Set it for a self-hosted or proxied deployment.
    - name: openai
      kind: open-ai
      api_key_env: OPENAI_API_KEY
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: DxgatePolicy
metadata:
  name: llm-budget
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  policy:
    name: llm-budget
    action: allow
    auth:
      type: api-key
      header: authorization
      values:
        - Bearer dxgate-example
    # Accounted after each response from the provider's reported usage, so a
    # single request may cross the limit before the window closes.
    token_limit:
      tokens: 200000
      window_seconds: 3600
      key: route
    timeout_ms: 120000
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: DxgateBackend
metadata:
  name: gpt
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  backend:
    name: gpt
    type: llm
    provider: openai
    # Listing models scopes this backend: a request naming a model outside the
    # list is not eligible for it. An empty list accepts any model.
    models:
      - gpt-4o-mini
    policies:
      - llm-budget
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: DxgateRoute
metadata:
  name: chat
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  route:
    name: chat
    protocol: llm
    matches:
      - path:
          type: exact
          value: /v1/chat/completions
        method: POST
    weighted_backends:
      - name: gpt
        weight: 100
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: DxgateBackend
metadata:
  name: mcp-tools
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  backend:
    name: mcp-tools
    type: mcp
    endpoint: http://mcp-tools.dubbo-system.svc:8080/mcp
---
apiVersion: gateway.dxgate.io/v1alpha1
kind: DxgateRoute
metadata:
  name: mcp
  namespace: dubbo-system
  labels:
    app.kubernetes.io/name: dxgate
spec:
  route:
    name: mcp
    protocol: mcp
    matches:
      - path:
          type: prefix
          value: /mcp
    # With more than one MCP backend on a route, dxgate answers `tools/list` by
    # querying every backend and merging the results; a session sticks to the
    # backend that opened it.
    weighted_backends:
      - name: mcp-tools
        weight: 100
